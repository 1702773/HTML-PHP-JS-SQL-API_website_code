<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>Choose Action</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      text-align: center;
      width: 350px;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      border-radius: 8px;
      border: none;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .create { background-color: #4CAF50; }
    .create:hover { background-color: #45a049; }

    .delete { background-color: #f44336; }
    .delete:hover { background-color: #d32f2f; }

    .change { background-color: #2196F3; }
    .change:hover { background-color: #1976D2; }

    a {
      display: block;
      margin-top: 15px;
      color: #333;
      text-decoration: none;
    }
  </style>
</head>
<body>
<div class="container">
  <h2>Please Choose an Action</h2>
  <button class="create" onclick="location.href='create.html'">Create User</button>
  <button class="delete" onclick="location.href='delete.html'">Delete User</button>
  <button class="change" onclick="location.href='change.html'">Change User</button>
  <a href="index.html">Return to Home</a>
</div>
</body>
</html>
